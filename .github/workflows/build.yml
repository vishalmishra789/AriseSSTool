name: Build Arise SS EXE
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR with Maven
        run: mvn clean package

      - name: Debug - List Files After Build
        run: dir target/

      - name: Create EXE with jpackage
        run: |
          jpackage --type exe `
          --dest . `
          --name AriseSSTool `
          --input target/ `
          --main-jar AriseSSTool-1.0.0.jar `
          --main-class com.arise.ss.MainApp `
          --win-shortcut `
          --win-menu `
          --vendor "AriseDev" `
          --app-version "1.0.0"

      - name: Debug - List Current Directory
        run: dir

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AriseSSTool-Installer
          # This wildcard path will find any .exe in the root folder
          path: "*.exe"
          retention-days: 5
