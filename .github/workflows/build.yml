name: Build Arise SS EXE
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Create EXE using jpackage
        run: |
          jpackage --type exe --name AriseSSTool --input target/ --main-jar AriseSSTool-1.0.0.jar --main-class com.arise.ss.MainApp --win-shortcut --win-menu

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v3
        with:
          name: AriseSSTool-Windows-EXE
          path: AriseSSTool-1.0.0.exe
