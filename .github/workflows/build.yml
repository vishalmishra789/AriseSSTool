name: Build Arise SS EXE
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # Updated to v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4  # Updated to v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Create EXE using jpackage
        # We use jpackage (included in JDK 17+) to bundle the jar into a Windows EXE
        run: |
          jpackage --type exe `
          --name AriseSSTool `
          --input target/ `
          --main-jar AriseSSTool-1.0.0.jar `
          --main-class com.arise.ss.MainApp `
          --win-shortcut `
          --win-menu `
          --vendor "Arise Development"

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4  # FIX: Updated to v4
        with:
          name: AriseSSTool-Windows-Installer
          path: AriseSSTool-1.0.0.exe  # This matches the name generated by jpackage
          retention-days: 5
